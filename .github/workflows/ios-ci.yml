name: ios-ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-full-client:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate public mirror boundary
        run: bash apps/ios/scripts/verify-public-mirror.sh

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.19.13"

      - name: Prepare pinned WireGuardKit
        working-directory: apps/ios
        run: |
          bash scripts/prepare-wireguard.sh
          bash scripts/verify-wireguard-source.sh

      - name: Install pinned XcodeGen
        run: bash apps/ios/scripts/install-xcodegen.sh

      - name: Prepare pinned libXray Apple runtime
        run: bash apps/mobile-runtime/prepare-libxray-apple.sh

      - name: Generate Xcode project
        working-directory: apps/ios
        run: xcodegen generate

      - name: Build app and both tunnel extensions for generic iOS device
        working-directory: apps/ios
        run: >
          xcodebuild
          -project AdaptiveVPNCI.xcodeproj
          -scheme AdaptiveVPN
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath "$GITHUB_WORKSPACE/.ci-derived/device"
          CODE_SIGNING_ALLOWED=NO
          build-for-testing

      - name: Build and run iOS unit tests on an available simulator
        working-directory: apps/ios
        shell: bash
        run: |
          set -euo pipefail

          simulator_udid="$(
            xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("no available iPhone simulator")
          '
          )"

          xcrun simctl boot "$simulator_udid" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$simulator_udid" -b

          derived="$GITHUB_WORKSPACE/.ci-derived/simulator"

          xcodebuild \
            -project AdaptiveVPNCI.xcodeproj \
            -scheme AdaptiveVPN \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$simulator_udid" \
            -derivedDataPath "$derived" \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing

          app_plist="$derived/Build/Products/Debug-iphonesimulator/AdaptiveVPN.app/Info.plist"
          wg_plist="$derived/Build/Products/Debug-iphonesimulator/AdaptiveVPN.app/PlugIns/AdaptiveVPNTunnel.appex/Info.plist"
          xray_plist="$derived/Build/Products/Debug-iphonesimulator/AdaptiveVPN.app/PlugIns/AdaptiveVPNXrayTunnel.appex/Info.plist"

          for plist in "$app_plist" "$wg_plist" "$xray_plist"; do
            [[ -f "$plist" ]] || { echo "missing built Info.plist: $plist" >&2; exit 1; }
          done

          app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_plist")"
          app_marketing="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_plist")"
          for plist in "$wg_plist" "$xray_plist"; do
            [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" == "$app_version" ]]
            [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" == "$app_marketing" ]]
          done

          xcodebuild \
            -project AdaptiveVPNCI.xcodeproj \
            -scheme AdaptiveVPN \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$simulator_udid" \
            -derivedDataPath "$derived" \
            CODE_SIGNING_ALLOWED=NO \
            test-without-building
