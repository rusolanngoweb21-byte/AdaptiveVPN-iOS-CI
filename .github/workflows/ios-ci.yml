name: ios-ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-xray:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate public mirror boundary
        run: bash apps/ios/scripts/verify-public-mirror.sh

      - name: Install pinned XcodeGen
        run: bash apps/ios/scripts/install-xcodegen.sh

      - name: Prepare pinned libXray Apple runtime
        run: bash apps/mobile-runtime/prepare-libxray-apple.sh

      - name: Generate Xcode project
        working-directory: apps/ios
        run: xcodegen generate

      - name: Build host app and Xray extension for generic iOS device
        working-directory: apps/ios
        run: >
          xcodebuild
          -project AdaptiveVPNCI.xcodeproj
          -scheme AdaptiveVPN
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath "$GITHUB_WORKSPACE/.ci-derived/device"
          CODE_SIGNING_ALLOWED=NO
          build-for-testing

      - name: Build and run iOS unit tests on an available simulator
        working-directory: apps/ios
        shell: bash
        run: |
          set -euo pipefail

          simulator_udid="$(
            xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("no available iPhone simulator")
          '
          )"

          xcrun simctl boot "$simulator_udid" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$simulator_udid" -b

          derived="$GITHUB_WORKSPACE/.ci-derived/simulator"

          xcodebuild \
            -project AdaptiveVPNCI.xcodeproj \
            -scheme AdaptiveVPN \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$simulator_udid" \
            -derivedDataPath "$derived" \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing

          app_plist="$derived/Build/Products/Debug-iphonesimulator/AdaptiveVPN.app/Info.plist"
          extension_plist="$derived/Build/Products/Debug-iphonesimulator/AdaptiveVPN.app/PlugIns/AdaptiveVPNXrayTunnel.appex/Info.plist"

          [[ -f "$app_plist" ]] || { echo "missing built app Info.plist" >&2; exit 1; }
          [[ -f "$extension_plist" ]] || { echo "missing built Xray extension Info.plist" >&2; exit 1; }

          app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_plist")"
          extension_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$extension_plist")"
          app_marketing="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_plist")"
          extension_marketing="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$extension_plist")"

          [[ -n "$app_version" && -n "$extension_version" ]] || {
            echo "app/extension CFBundleVersion must be non-empty" >&2
            exit 1
          }
          [[ "$app_version" == "$extension_version" ]] || {
            echo "app/extension CFBundleVersion mismatch" >&2
            exit 1
          }
          [[ "$app_marketing" == "$extension_marketing" ]] || {
            echo "app/extension CFBundleShortVersionString mismatch" >&2
            exit 1
          }

          xcodebuild \
            -project AdaptiveVPNCI.xcodeproj \
            -scheme AdaptiveVPN \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$simulator_udid" \
            -derivedDataPath "$derived" \
            CODE_SIGNING_ALLOWED=NO \
            test-without-building
