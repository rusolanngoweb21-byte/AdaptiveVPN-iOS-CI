name: AdaptiveVPNCI

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    ALWAYS_SEARCH_USER_PATHS: NO

targets:
  AdaptiveVPN:
    type: application
    platform: iOS
    sources:
      - path: AdaptiveVPN
      - path: XrayShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adaptivevpn.ci
        PRODUCT_NAME: AdaptiveVPN
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: AdaptiveVPN/AdaptiveVPN.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_BITCODE: NO
        ENABLE_TESTABILITY: YES
        SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    dependencies:
      - target: AdaptiveVPNXrayTunnel
        embed: true

  AdaptiveVPNXrayTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: XrayPacketTunnel
      - path: XrayShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adaptivevpn.ci.xray-tunnel
        PRODUCT_NAME: AdaptiveVPNXrayTunnel
        INFOPLIST_FILE: XrayPacketTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: XrayPacketTunnel/AdaptiveVPNXrayTunnel.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_BITCODE: NO
        OTHER_LDFLAGS: "$(inherited) -lresolv"
    dependencies:
      - framework: Vendor/libxray/LibXray.xcframework

  AdaptiveVPNTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AdaptiveVPNTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adaptivevpn.ci.tests
        PRODUCT_NAME: AdaptiveVPNTests
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_BITCODE: NO
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AdaptiveVPN.app/AdaptiveVPN"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    dependencies:
      - target: AdaptiveVPN

schemes:
  AdaptiveVPN:
    build:
      targets:
        AdaptiveVPN: all
        AdaptiveVPNXrayTunnel: all
        AdaptiveVPNTests: [test]
    test:
      targets:
        - AdaptiveVPNTests
