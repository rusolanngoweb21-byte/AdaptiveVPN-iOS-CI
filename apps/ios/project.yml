name: AdaptiveVPNCI

options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: "16.0"

packages:
  WireGuardKit:
    path: Vendor/wireguard-apple

settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 16.0
    ALWAYS_SEARCH_USER_PATHS: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  WireGuardGoBridgeiOS:
    type: ""
    platform: iOS
    settings:
      base:
        SDKROOT: iphoneos
        ENABLE_BITCODE: NO
    legacy:
      toolPath: /usr/bin/make
      passSettings: true
      workingDirectory: "$(PROJECT_DIR)/Vendor/wireguard-apple/Sources/WireGuardKitGo"

  AdaptiveVPN:
    type: application
    platform: iOS
    sources:
      - path: AdaptiveVPN
      - path: Shared
      - path: XrayShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adaptivevpn.ci
        PRODUCT_NAME: AdaptiveVPN
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        VERSIONING_SYSTEM: apple-generic
        SWIFT_VERSION: 5.0
        INFOPLIST_FILE: AdaptiveVPN/Info.plist
        CODE_SIGN_ENTITLEMENTS: AdaptiveVPN/AdaptiveVPN.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_BITCODE: NO
        ENABLE_TESTABILITY: YES
        SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: AdaptiveVPNTunnel
        embed: true
      - target: AdaptiveVPNXrayTunnel
        embed: true

  AdaptiveVPNTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adaptivevpn.ci.tunnel
        PRODUCT_NAME: AdaptiveVPNTunnel
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        VERSIONING_SYSTEM: apple-generic
        SWIFT_VERSION: 5.0
        INFOPLIST_FILE: PacketTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/AdaptiveVPNTunnel.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_BITCODE: NO
    dependencies:
      - target: WireGuardGoBridgeiOS
      - package: WireGuardKit

  AdaptiveVPNXrayTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: XrayPacketTunnel
      - path: XrayShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adaptivevpn.ci.xray-tunnel
        PRODUCT_NAME: AdaptiveVPNXrayTunnel
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        VERSIONING_SYSTEM: apple-generic
        SWIFT_VERSION: 5.0
        INFOPLIST_FILE: XrayPacketTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: XrayPacketTunnel/AdaptiveVPNXrayTunnel.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_BITCODE: NO
        OTHER_LDFLAGS: "$(inherited) -lresolv"
    dependencies:
      - framework: Vendor/libxray/LibXray.xcframework

  # Simulator-only host for unit tests. It deliberately does not embed the
  # production WireGuard/Xray packet-tunnel extensions: the real extensions
  # are compiled and linked by the generic-device gate above, while simulator
  # tests exercise app/shared policy code without trying to link the
  # iphoneos-only WireGuard Go bridge into an iOS Simulator binary.
  AdaptiveVPNSimulatorHost:
    type: application
    platform: iOS
    sources:
      - path: AdaptiveVPN
      - path: Shared
      - path: XrayShared
    resources:
      - path: AdaptiveVPN/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adaptivevpn.ci.simulator-host
        PRODUCT_NAME: AdaptiveVPNTestHost
        PRODUCT_MODULE_NAME: AdaptiveVPN
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        VERSIONING_SYSTEM: apple-generic
        SWIFT_VERSION: 5.0
        INFOPLIST_FILE: AdaptiveVPN/Info.plist
        CODE_SIGN_STYLE: Automatic
        ENABLE_BITCODE: NO
        ENABLE_TESTABILITY: YES
        SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        TARGETED_DEVICE_FAMILY: "1,2"

  AdaptiveVPNTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AdaptiveVPNTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adaptivevpn.ci.tests
        PRODUCT_NAME: AdaptiveVPNTests
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_BITCODE: NO
        ENABLE_TESTABILITY: YES
        SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AdaptiveVPNTestHost.app/AdaptiveVPNTestHost"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: AdaptiveVPNSimulatorHost

schemes:
  AdaptiveVPN:
    build:
      targets:
        AdaptiveVPN: all
        AdaptiveVPNTunnel: all
        AdaptiveVPNXrayTunnel: all

  AdaptiveVPNSimulatorTests:
    build:
      targets:
        AdaptiveVPNSimulatorHost: all
        AdaptiveVPNTests: [test]
    test:
      targets:
        - AdaptiveVPNTests
